services:
  # MySQL Database
  dmsdata:
    image: mysql:8.0.34
    container_name: dms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-dmsdb}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/create_schema_prod.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dms_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      timeout: 20s
      retries: 10

  # Flask Backend API
  dmsback:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: dms_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
      - DB_HOST=dmsdata
      - DB_PORT=3306
      - DB_USER=${DB_USER:?DB_USER is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_NAME:-dmsdb}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
    depends_on:
      dmsdata:
        condition: service_healthy
    networks:
      - dms_network
    volumes:
      - ./backend/logs:/app/logs


  # React Frontend
  dmsfront:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:5000}
    container_name: dms_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - dmsback
    networks:
      - dms_network

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: dms_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - dmsfront
      - dmsback
    networks:
      - dms_network
    profiles:
      - production
      
volumes:
  db_data:
    driver: local
  mailu_data:
    driver: local

networks:
  dms_network:
    driver: bridge
